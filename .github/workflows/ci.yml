name: CI

on:
  push:
    branches: [ main, mean_reversion, rsi_tracker ]
  pull_request:
    branches: [ main, mean_reversion ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[notebook]
      - name: Smoke import test
        run: |
          python - <<'PY'
import asyncio
asyncio.set_event_loop(asyncio.new_event_loop())
import data_engine
print('data_engine import ok')
PY
