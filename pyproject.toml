[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trade"
version = "0.1.0"
description = "Mean reversion backtest notebook plus RSI tracker and IBKR helpers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "plotly>=6.0",
  "yfinance>=0.2",
  "chardet>=5.0",
  "pytz>=2024.1",
  "ib_insync>=0.9",
  "rich>=13.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
]

[tool.setuptools]
py-modules = ["data_engine"]

[tool.setuptools.packages.find]
include = ["rsi_tracker*", "ibkr*"]
